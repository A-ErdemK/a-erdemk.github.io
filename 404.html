<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable, Erdem Kurac</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0D1033">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&family=Unbounded:wght@600&display=swap">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script>
    (function () {
      var d = document.documentElement, t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      d.dataset.theme = t;
    })();
  </script>
  <style>
    body { background-image: radial-gradient(rgba(var(--dot), 0.28) 1px, transparent 1.5px); background-size: 26px 26px; }
    .lost { display: grid; place-items: center; min-height: 100vh; padding: 24px 16px; }
    .lost__card { width: min(520px, 100%); padding: clamp(24px, 5vw, 40px); border: 1px solid var(--line); border-radius: 18px; background: color-mix(in srgb, var(--surface) 92%, transparent); box-shadow: var(--shadow); }
    .lost .lost__code { margin-top: 0; color: var(--accent-ink); font: 400 0.875rem var(--mono); }
    .lost h1 { margin-top: 6px; font: 600 clamp(1.6rem, 5vw, 2.1rem)/1.15 var(--display); letter-spacing: -0.015em; }
    .lost p { margin-top: 12px; color: var(--ink-2); font-size: 1.0625rem; }
    .lost .btn { margin-top: 24px; }
  </style>
</head>
<body>
  <main class="lost">
    <div class="lost__card">
      <p class="lost__code">Erreur 404</p>
      <h1>Cette page n'existe pas.</h1>
      <p>Le lien est peut-être ancien ou mal recopié. Les projets et mes coordonnées sont sur la page d'accueil.</p>
      <a class="btn btn--primary" href="/">Revenir à l'accueil</a>
    </div>
  </main>
</body>
</html>
