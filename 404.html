<!doctype html>
<html lang="fr" data-palette="gulf">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable, Erdem Kurac</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Onest:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script>
    (function () {
      var d = document.documentElement, t = null, p = null;
      try { t = localStorage.getItem("theme"); p = localStorage.getItem("palette"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      d.dataset.theme = t;
      if (p) d.dataset.palette = p;
    })();
  </script>
  <style>
    .lost { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .lost .app { width: min(560px, 100%); margin: 0; }
    .lost__body { padding: 28px clamp(20px, 4vw, 36px) 32px; }
    .lost h1 { font-size: clamp(1.9rem, 5vw, 2.6rem); font-weight: 600; line-height: 1.1; }
    .lost p { margin-top: 0.75rem; color: var(--ink-2); font-size: 1.0625rem; }
    .lost .btn { margin-top: 1.5rem; }
  </style>
</head>
<body>
  <main class="lost">
    <div class="app">
      <div class="app__bar">
        <span class="app__icon ico--contact" aria-hidden="true">!</span>
        <span class="app__name">Fenêtre introuvable</span>
      </div>
      <div class="lost__body">
        <h1>Cette page n'existe pas.</h1>
        <p>Le lien est peut-être ancien ou mal recopié. Tout le reste est sur la page d'accueil.</p>
        <a class="btn btn--accent" href="/">Revenir à l'accueil</a>
      </div>
    </div>
  </main>
</body>
</html>
